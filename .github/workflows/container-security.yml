name: Container Security

on:
  push:
  pull_request:
  # Adds a manual "Run workflow" button, needed for the Lab 10 Step 5 gate test.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container-security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build hardened container image
        run: docker build -t my-app:${{ github.sha }} .

      - name: Hadolint Dockerfile
        run: docker run --rm -i hadolint/hadolint < Dockerfile

      - name: Install Trivy
        shell: bash
        env:
          TRIVY_VERSION: v0.74.0
          TRIVY_INSTALL_COMMIT: e1fd17a0ea4a8cf24bc4b4dd7e2cfbf4bb31b994
        run: |
          set -euo pipefail

          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/aquasecurity/trivy/${TRIVY_INSTALL_COMMIT}/contrib/install.sh" \
            --output "${RUNNER_TEMP}/install-trivy.sh"

          mkdir -p "${RUNNER_TEMP}/trivy-bin"

          sh "${RUNNER_TEMP}/install-trivy.sh" \
            -b "${RUNNER_TEMP}/trivy-bin" "${TRIVY_VERSION}"

          echo "${RUNNER_TEMP}/trivy-bin" >> "$GITHUB_PATH"

      - name: Scan image for Critical vulnerabilities
        run: |
          trivy image \
            --scanners vuln \
            --severity CRITICAL \
            --exit-code 1 \
            my-app:${{ github.sha }}

  publish-sign:
    name: Publish, Sign, Attest
    needs: container-security

    # Publish only on pushes to main, or on a manual run (used for the Step 5 test).
    # Pull requests never publish, sign, attest, or request OIDC tokens.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    # Passed to the verify and deploy jobs. $GITHUB_ENV does not cross jobs.
    outputs:
      image-repo: ${{ steps.image.outputs.image-repo }}
      digest: ${{ steps.image.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Define image name
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_REPO="ghcr.io/${GITHUB_REPOSITORY,,}"
          IMAGE="${IMAGE_REPO}:${GITHUB_SHA}"

          echo "IMAGE_REPO=${IMAGE_REPO}" >> "$GITHUB_ENV"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"

          echo "Image: ${IMAGE}"

      - name: Build image for publishing
        run: docker build -t "$IMAGE" .

      - name: Install Trivy
        shell: bash
        env:
          TRIVY_VERSION: v0.74.0
          TRIVY_INSTALL_COMMIT: e1fd17a0ea4a8cf24bc4b4dd7e2cfbf4bb31b994
        run: |
          set -euo pipefail

          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/aquasecurity/trivy/${TRIVY_INSTALL_COMMIT}/contrib/install.sh" \
            --output "${RUNNER_TEMP}/install-trivy.sh"

          mkdir -p "${RUNNER_TEMP}/trivy-bin"

          sh "${RUNNER_TEMP}/install-trivy.sh" \
            -b "${RUNNER_TEMP}/trivy-bin" "${TRIVY_VERSION}"

          echo "${RUNNER_TEMP}/trivy-bin" >> "$GITHUB_PATH"

      - name: Gate published image on Critical vulnerabilities
        run: |
          trivy image \
            --scanners vuln \
            --severity CRITICAL \
            --exit-code 1 \
            "$IMAGE"

      - name: Log in to GitHub Container Registry
        shell: bash
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" |
            docker login ghcr.io \
              -u "${{ github.actor }}" \
              --password-stdin

      - name: Push image
        run: docker push "$IMAGE"

      - name: Resolve immutable image digest
        id: image
        shell: bash
        run: |
          set -euo pipefail

          DIGEST="$(
            docker buildx imagetools inspect "$IMAGE" |
            awk '/^Digest:/ {print $2; exit}'
          )"

          if [ -z "$DIGEST" ]; then
            echo "Unable to resolve image digest"
            exit 1
          fi

          IMAGE_REF="${IMAGE_REPO}@${DIGEST}"

          # For later steps in this job
          echo "IMAGE_DIGEST=${DIGEST}" >> "$GITHUB_ENV"
          echo "IMAGE_REF=${IMAGE_REF}" >> "$GITHUB_ENV"

          # For the verify and deploy jobs
          echo "image-repo=${IMAGE_REPO}" >> "$GITHUB_OUTPUT"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

          echo "Image: ${IMAGE_REF}"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image with GitHub OIDC
        run: cosign sign --yes "$IMAGE_REF"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@PASTE-FULL-COMMIT-SHA-HERE # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.image-repo }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

  verify:
    name: Verify Provenance and Signature
    needs: publish-sign
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read
      attestations: read

    env:
      IMAGE_REF: ${{ needs.publish-sign.outputs.image-repo }}@${{ needs.publish-sign.outputs.digest }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Log in to GitHub Container Registry
        shell: bash
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" |
            docker login ghcr.io \
              -u "${{ github.actor }}" \
              --password-stdin

      - name: Verify build provenance
        run: |
          gh attestation verify "oci://${IMAGE_REF}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/container-security.yml"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify Cosign signature
        run: |
          cosign verify "${IMAGE_REF}" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/container-security.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

  deploy:
    name: Deploy
    needs: [publish-sign, verify]
    runs-on: ubuntu-latest

    steps:
      - name: Deploy (placeholder)
        run: echo "Would deploy ${{ needs.publish-sign.outputs.image-repo }}@${{ needs.publish-sign.outputs.digest }}"